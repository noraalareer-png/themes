name: Theme QA

on:
  workflow_dispatch:
    inputs:
      preview_base:
        description: "Preview host base, e.g. https://i1o0np.dev.zid.store"
        required: true
      theme_id:
        description: "Theme id (uuid)"
        required: true
      preset_url:
        description: "URL of the partner's preset export (.json) — attached on the submission UI"
        required: false
      preset_b64:
        description: "Base64 of the partner's preset JSON (sent inline by the submission form)"
        required: false
      report_to:
        description: "Email to receive the report"
        required: false
      theme_name:
        description: "Theme name / host"
        required: false
  repository_dispatch:
    types: [theme_submitted]

permissions:
  contents: read

concurrency:
  group: theme-qa-${{ github.event.inputs.theme_id || github.event.client_payload.theme_id }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: ${{ github.event.inputs.preview_base || github.event.client_payload.preview_base }}
      THEME_ID: ${{ github.event.inputs.theme_id || github.event.client_payload.theme_id }}
      THEME_NAME: ${{ github.event.inputs.theme_name || github.event.client_payload.theme_name }}
      REPORT_TO: ${{ github.event.inputs.report_to || github.event.client_payload.report_to }}
      PRESET_URL: ${{ github.event.inputs.preset_url || github.event.client_payload.preset_url }}
      PRESET_B64: ${{ github.event.inputs.preset_b64 || github.event.client_payload.preset_b64 }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      # Fixture customer login for authenticated tests (optional; defaults live in lib/auth.js)
      QA_LOGIN_PHONE: ${{ vars.QA_LOGIN_PHONE }}
      QA_LOGIN_OTP: ${{ secrets.QA_LOGIN_OTP }}
      QA_LOGIN_COUNTRY_CODE: ${{ vars.QA_LOGIN_COUNTRY_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install beautifulsoup4

      # Layer 1 - structural gate (writes runs/<theme>/validate.json)
      - name: Structural validation (/validate)
        continue-on-error: true
        run: python validate_check.py --preview "$PREVIEW_BASE" --theme "$THEME_ID"

      # Section inventory (what the theme SHIPS) from /validate.
      - name: Enumerate shipped sections
        continue-on-error: true
        run: python enumerate_sections.py --preview "$PREVIEW_BASE" --theme "$THEME_ID" --out "runs/$THEME_ID/sections_inventory.json"

      # Section coverage: uses the partner's preset if available.
      # Preset source, in order: (1) PRESET_URL from the submission payload/input
      # (the dashboard attaches it — platform change, see SECTION_COVERAGE.md),
      # (2) a local preset.json committed/placed in the repo (interim, works today).
      # sections.json (placed) is what tests/05_sections.spec.js reads (repo root).
      - name: Section coverage (preset)
        continue-on-error: true
        run: |
          if [ -n "$PRESET_B64" ]; then
            echo "Decoding preset from the submission form (base64)"
            echo "$PRESET_B64" | base64 -d > preset.json || echo "WARN: preset decode failed"
          elif [ -n "$PRESET_URL" ]; then
            echo "Fetching preset from PRESET_URL"
            curl -fsSL "$PRESET_URL" -o preset.json || echo "WARN: preset download failed"
          fi
          if [ -f preset.json ]; then
            python sections_from_preset.py preset.json --out sections.json
            python sections_coverage.py \
              --preset preset.json \
              --validate "runs/$THEME_ID/sections_inventory.json" \
              --out "runs/$THEME_ID/coverage.json"
            # add --fail-on-missing above to gate on unplaced sections (policy decision)
          else
            echo "No preset (PRESET_URL empty and no local preset.json) — section coverage skipped."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium webkit

      # Layer 2 - functional / visual E2E (writes runs/<theme>/)
      - name: E2E tests
        continue-on-error: true
        run: npx playwright test

      # Build the single-file HTML report and email it to the requester (Resend)
      - name: Build report
        run: node scripts/build_report.js "$THEME_ID"
      - name: Email report
        run: node scripts/email_report.js "$THEME_ID"

      # Keep the report as a downloadable artifact on the run (optional)
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-qa-report
          path: runs/${{ github.event.inputs.theme_id || github.event.client_payload.theme_id }}/report.html
          if-no-files-found: warn

      # Success metric = the AUTOMATION completed (report produced + emailed),
      # NOT whether the theme passed. Theme findings live inside the report.
      - name: Automation check
        run: |
          node -e "const fs=require('fs');const p='runs/'+process.env.THEME_ID+'/report.html';if(!fs.existsSync(p)){console.error('Automation did not complete: no report produced');process.exit(1)}console.log('Automation completed: report built and emailed')"
